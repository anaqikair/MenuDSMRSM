<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10231b">
  <meta name="description" content="Paparan menu harian Dewan Selera.">
  <title>Menu Dewan Selera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="brand-mark" aria-label="Logo MARA MRSM"><img src="logo.png" alt="MARA MRSM logo"></div>
      <div class="hero-copy">
        <p class="eyebrow">DEWAN SELERA</p>
        <h1>Menu Hari Ini</h1>
        <p id="fullDate" class="date-text"></p>
      </div>
      <div class="date-badge" aria-label="Hari dalam bulan">
        <span id="dayNumber">--</span>
        <small>HB</small>
      </div>
    </header>

    <main>
      <section class="date-panel" aria-label="Pilih tarikh">
        <div class="date-heading">
          <span class="section-kicker">LIHAT MENU</span>
          <strong>Pilih tarikh</strong>
        </div>
        <div class="date-controls">
          <button id="prevBtn" class="icon-btn" aria-label="Hari sebelumnya">←</button>
          <label class="date-input-wrap">
            <span class="sr-only">Tarikh</span>
            <input id="datePicker" type="date">
          </label>
          <button id="todayBtn" class="today-btn">Hari Ini</button>
          <button id="nextBtn" class="icon-btn" aria-label="Hari seterusnya">→</button>
        </div>
      </section>

      <section>
        <div class="menu-heading">
          <div>
            <span class="section-kicker">MENU HARIAN</span>
            <h2>Hidangan</h2>
          </div>
          <span class="meal-count">5 hidangan</span>
        </div>
        <section id="menuGrid" class="menu-grid" aria-label="Senarai menu"></section>
      </section>

      <section class="feedback-panel" aria-labelledby="feedbackTitle">
        <div class="feedback-heading">
          <span class="section-kicker">SUARA ANDA</span>
          <h2 id="feedbackTitle">Penilaian & Cadangan Menu</h2>
          <p class="feedback-desc">Kongsi maklum balas anda untuk membantu meningkatkan kualiti makanan Dewan Selera.</p>
        </div>

        <form id="feedbackForm" class="feedback-form">
          <div class="form-row">
            <div class="form-group">
              <label for="reporterInput">Nama & Kelas <span class="required-star">*</span></label>
              <input type="text" id="reporterInput" placeholder="cth. Anaqi 4IQ" required autocomplete="name">
            </div>

            <div class="form-group">
              <label for="mealSelect">Hidangan Yang Dinilai <span class="required-star">*</span></label>
              <select id="mealSelect" required>
                <!-- Dihasilkan secara dinamik (lalai kepada menu semasa) -->
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Penilaian Menu <span class="required-star">*</span></label>
            <div class="star-rating-wrap">
              <div class="star-rating" id="starRating" role="radiogroup" aria-label="Penilaian 1 hingga 5 bintang">
                <button type="button" class="star-btn" data-value="1" aria-label="1 bintang">★</button>
                <button type="button" class="star-btn" data-value="2" aria-label="2 bintang">★</button>
                <button type="button" class="star-btn" data-value="3" aria-label="3 bintang">★</button>
                <button type="button" class="star-btn" data-value="4" aria-label="4 bintang">★</button>
                <button type="button" class="star-btn" data-value="5" aria-label="5 bintang">★</button>
              </div>
              <span class="rating-label" id="ratingLabel">Sila pilih rating</span>
            </div>
            <input type="hidden" id="ratingValue" name="rating" value="0">
          </div>

          <div class="form-group">
            <label for="suggestionInput">Cadangan / Komen</label>
            <textarea id="suggestionInput" rows="3" placeholder="Tulis cadangan atau komen anda mengenai menu ini..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitFeedbackBtn" class="submit-btn">
              <span class="btn-text">Hantar Penilaian</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </div>

          <div id="feedbackStatus" class="feedback-status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <footer>
      <p>Dicipta oleh BWP MRSM Bentong</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
